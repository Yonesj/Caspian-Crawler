[project]
name = "caspian-crawler"
version = "0.1.0"
description = "Crawling, normalization, deduplication and API backend for northern-Iran real-estate listings"
readme = "README.md"
authors = [
    { name = "Younes Jamshidi", email = "jamshidiyounes92@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.6.3",
    "django>=6.1.1",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.1",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt>=5.5.1",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "jdatetime>=6.1.0",
    "playwright>=1.63.0",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "selectolax>=0.4.11",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "drf-spectacular>=0.30.0",
    "freezegun>=1.5.5",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pytest-mock>=3.15.1",
    "respx>=0.23.1",
    "djangorestframework-stubs>=3.18.1",
    "fakeredis>=2.38.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-m 'not network and not playwright' -q"
markers = [
    "integration: exercises the database and/or the HTTP API",
    "network: talks to real crawl sources; deselected by default",
    "playwright: requires browser binaries; deselected by default",
]
